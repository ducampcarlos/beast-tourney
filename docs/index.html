<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14101f">
<meta name="description" content="Beast Tourney: a fantasy creature auto-battler. Buy, merge and bond a team of beasts, then watch them fight through a 12-round tournament.">
<title>Beast Tourney</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Beast Tourney">
<meta property="og:description" content="A fantasy creature auto-battler for the browser. Buy, merge and bond beasts, then fight through a 12-round tournament.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ducampcarlos.github.io/beast-tourney/assets/img/preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face { font-family: "KenneyPixel"; src: url("assets/fonts/KenneyPixel.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "KenneyMini"; src: url("assets/fonts/KenneyMiniSquare.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #14101f; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #e8d9b5; font: 20px/1.4 "KenneyPixel", monospace; letter-spacing: 1px; pointer-events: none; }
  #rotate { display: none; position: fixed; left: 0; right: 0; top: 0; padding: 6px 10px; background: #2a1f1a; color: #f2c14e; font: 14px/1.3 "KenneyPixel", monospace; text-align: center; z-index: 5; pointer-events: none; }
  @media (orientation: portrait) and (max-width: 800px) { #rotate { display: block; } }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #e8d9b5; font: 18px sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">Loading...</div>
<div id="rotate">Turn your device sideways for a bigger game</div>
<noscript>Beast Tourney needs JavaScript to run.</noscript>
<script src="game.js"></script>
<script>
  // Offline support. Not on file:// or in the local dev server (localhost), where a stale cache would only get in the way.
  if ("serviceWorker" in navigator) {
    if (location.protocol.startsWith("http") && location.hostname !== "localhost") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    else navigator.serviceWorker.getRegistrations().then((all) => all.forEach((r) => r.unregister())).catch(() => {});
  }
</script>
</body>
</html>
